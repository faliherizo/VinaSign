@switch (etat()) {
  @case ('chargement') { <p class="vs-chargement" role="status">{{ i18n.t('document.chargement') }}</p> }
  @case ('erreur') { <p role="alert" class="bandeau erreur">{{ i18n.t('document.erreur') }}</p> }
  @default {
    <section class="pages" [attr.aria-label]="i18n.t('document.titre')">
      @for (page of pages(); track page.numero) {
        <figure class="page">
          <div class="surface">
            <canvas #toile aria-hidden="true"></canvas>
            @for (champ of champsDeLaPage(page.numero); track champ.id) {
              <span class="repere" aria-hidden="true" [style.left.%]="champ.x * 100" [style.top.%]="champ.y * 100"
                    [style.width.%]="champ.largeur * 100" [style.height.%]="champ.hauteur * 100"></span>
            }
          </div>
          <figcaption>{{ i18n.t('document.page') }} {{ page.numero }} / {{ pages().length }}</figcaption>
          <div class="texte-page">{{ page.texte }}</div>
        </figure>
      }
    </section>
  }
}
