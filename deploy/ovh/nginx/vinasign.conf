# ── VinaSign (signature électronique) ── bloc du Nginx central (~/vina-cms/nginx/prod.conf), référence versionnée.
# Certificat : lignée propre vinasign.vinaitsolution.com (webroot). Ajouter un nom :
#   docker exec vina_certbot certbot certonly --webroot -w /var/www/certbot --cert-name vinasign.vinaitsolution.com --expand \
#     -d vinasign.vinaitsolution.com -d signer.vinasign.vinaitsolution.com -d id.vinasign.vinaitsolution.com \
#     -d courriel.vinasign.vinaitsolution.com -d <nouveau>.vinasign.vinaitsolution.com
# Les noms *.vinasign.vinaitsolution.com (DNS générique) mènent au portail ; leur certificat s'ajoute par --expand.

# Portail (préparation, suivi) et API ; jetons des applications clientes relayés au serveur.
server {
    listen 443 ssl;
    http2 on;
    server_name vinasign.vinaitsolution.com *.vinasign.vinaitsolution.com;
    ssl_certificate     /etc/letsencrypt/live/vinasign.vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinasign.vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 30m;   # documents jusqu'à 25 Mo (VS-021)
    set $vinasign_portail http://vinasign-portail:8080;
    set $vinasign_serveur http://vinasign-serveur:8300;
    location /oauth2/ {
        proxy_pass $vinasign_serveur;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass $vinasign_portail;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Écran du signataire : origine propre, intégrable en iframe seulement par les origines déclarées (VS-055).
server {
    listen 443 ssl;
    http2 on;
    server_name signer.vinasign.vinaitsolution.com;
    ssl_certificate     /etc/letsencrypt/live/vinasign.vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinasign.vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;
    set $vinasign_signataire http://vinasign-signataire:8080;
    location / {
        proxy_pass $vinasign_signataire;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Fournisseur d'identité : seul le royaume vinasign est public ; la console d'administration et le royaume master ne le
# sont pas (administration par kcadm dans le conteneur).
server {
    listen 443 ssl;
    http2 on;
    server_name id.vinasign.vinaitsolution.com;
    ssl_certificate     /etc/letsencrypt/live/vinasign.vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinasign.vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    set $vinasign_id http://vinasign-keycloak:8080;
    location ~ ^/(realms/vinasign|resources)/ {
        proxy_pass $vinasign_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }
    location / { return 404; }
}

# Boîte des courriels de la démonstration (Mailpit, accès par mot de passe) : invitations et codes des signataires.
server {
    listen 443 ssl;
    http2 on;
    server_name courriel.vinasign.vinaitsolution.com;
    ssl_certificate     /etc/letsencrypt/live/vinasign.vinaitsolution.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vinasign.vinaitsolution.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    set $vinasign_courriel http://vinasign-courriel:8025;
    location / {
        proxy_pass $vinasign_courriel;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
