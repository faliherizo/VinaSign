# VinaSign — démonstration https://vinasign.vinaitsolution.com sur le VPS OVH partagé (une douzaine d'applications).
# Les images viennent de la CI (.github/workflows/deployer-vinasign.yml), jamais construites ici ; les secrets viennent de
# .env.vinasign (600, créé par preparer-serveur.sh) ; le mot de passe du magasin de cachet est lu dans l'ICP au démarrage
# par deployer.sh, jamais écrit sur disque hors de son volume. Chaque service a un plafond de mémoire : le serveur est partagé.
#
# Réseaux : « interne » relie les services ; « isole » (sans sortie) porte la conversion LibreOffice, qui analyse des
# fichiers de tiers ; « web » est celui du Nginx central (vina_nginx), qui ne voit que les points d'entrée publics.
name: vinasign

x-journal: &journal
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

services:
  base:
    image: postgres:16-alpine
    container_name: vinasign-db
    restart: unless-stopped
    <<: *journal
    environment:
      POSTGRES_DB: vinasign
      POSTGRES_USER: ${VINASIGN_DB_UTILISATEUR:?}
      POSTGRES_PASSWORD: ${VINASIGN_DB_MDP:?}
      VINASIGN_DB_ROLE_APPLICATIF: vinasign_application
      VINASIGN_DB_MDP_APPLICATIF: ${VINASIGN_DB_MDP_APPLICATIF:?}
      KEYCLOAK_DB_MDP: ${KEYCLOAK_DB_MDP:?}
    volumes:
      - base:/var/lib/postgresql/data
      - ../../infra/base/initialisation/01-compte-applicatif.sh:/docker-entrypoint-initdb.d/01-compte-applicatif.sh:ro
      - ./base/02-keycloak.sh:/docker-entrypoint-initdb.d/02-keycloak.sh:ro
    healthcheck: { test: ["CMD", "pg_isready", "-U", "${VINASIGN_DB_UTILISATEUR}", "-d", "vinasign"], interval: 5s, retries: 30 }
    mem_limit: 384m
    networks: [interne]

  stockage:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: vinasign-stockage
    restart: unless-stopped
    <<: *journal
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/donnees", "--skipApiVersionCheck"]
    environment:
      AZURITE_ACCOUNTS: "vinasign:${VINASIGN_AZURITE_CLE:?}"
    volumes: [stockage:/donnees]
    mem_limit: 256m
    networks: [interne]

  conversion:
    image: gotenberg/gotenberg:8.17.3
    container_name: vinasign-conversion
    restart: unless-stopped
    <<: *journal
    command: ["gotenberg", "--api-timeout=120s", "--chromium-disable-routes=true"]
    mem_limit: 768m
    networks: [isole]

  # Autorité de démonstration : cachet (PKCS#12), horodatage RFC 3161, OCSP et listes de révocation. Ses clés naissent ici,
  # dans le volume icp-etat, et n'en sortent pas. Les certificats portent « bac à sable » : ce n'est pas une AC reconnue.
  icp:
    image: vinasign/icp:${VINASIGN_VERSION:?}
    container_name: vinasign-icp
    restart: unless-stopped
    <<: *journal
    environment:
      ICP_PORT: "28090"
      ICP_URL_PUBLIQUE: http://vinasign-icp:28090
    volumes: ["../../infra/bacs-a-sable/icp:/icp:ro", "icp-etat:/etat"]
    healthcheck: { test: ["CMD", "curl", "-sf", "http://localhost:28090/sante"], interval: 5s, retries: 40 }
    mem_limit: 128m
    networks: [interne]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: vinasign-keycloak
    restart: unless-stopped
    <<: *journal
    command: ["start", "--http-enabled=true", "--proxy-headers=xforwarded", "--hostname=https://id.vinasign.vinaitsolution.com",
              "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://vinasign-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_MDP:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_MDP:?}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    depends_on: { base: { condition: service_healthy } }
    mem_limit: 768m
    networks: [interne, web]

  courriel:
    image: axllent/mailpit:v1.21.8
    container_name: vinasign-courriel
    restart: unless-stopped
    <<: *journal
    environment:
      MP_UI_AUTH_FILE: /auth/htpasswd
      MP_MAX_MESSAGES: "2000"
    volumes: ["./secrets/courriel.htpasswd:/auth/htpasswd:ro"]
    mem_limit: 96m
    networks: [interne, web]

  serveur:
    image: vinasign/serveur:${VINASIGN_VERSION:?}
    container_name: vinasign-serveur
    restart: unless-stopped
    <<: *journal
    env_file: .env.vinasign
    environment:
      VINASIGN_DB_URL: jdbc:postgresql://vinasign-db:5432/vinasign
      VINASIGN_STOCKAGE_CONNEXION: "DefaultEndpointsProtocol=http;AccountName=vinasign;AccountKey=${VINASIGN_AZURITE_CLE};BlobEndpoint=http://vinasign-stockage:10000/vinasign"
      VINASIGN_STOCKAGE_CREER_CONTENEUR: "true"
      VINASIGN_CONVERSION_URL: http://vinasign-conversion:3000
      VINASIGN_HORODATAGE_URL: http://vinasign-icp:28090/tsa
      VINASIGN_CACHET_FOURNISSEUR: pkcs12
      VINASIGN_CACHET_MAGASIN: /icp-etat/cachet.p12
      VINASIGN_CACHET_MOT_DE_PASSE: ${VINASIGN_CACHET_MOT_DE_PASSE:?lu dans l'ICP par deployer.sh}
      VINASIGN_JETONS_CLE_PRIVEE: ${VINASIGN_JETONS_CLE_PRIVEE:?lue dans secrets/jetons.pem par deployer.sh}
      VINASIGN_JETONS_CLE_EPHEMERE: "false"
      VINASIGN_SMTP_HOTE: vinasign-courriel
      VINASIGN_SMTP_PORT: "1025"
      VINASIGN_PORTAIL_JWKS: http://vinasign-keycloak:8080/realms/vinasign/protocol/openid-connect/certs
      VINASIGN_EN_TETES_RELAIS: native
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    volumes: ["icp-etat:/icp-etat:ro"]
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    depends_on:
      base: { condition: service_healthy }
      icp: { condition: service_healthy }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8300/actuator/health"], interval: 10s, retries: 30, start_period: 60s }
    mem_limit: 1g
    # « web » : le Nginx central relaie /oauth2 (jetons des applications clientes) directement au serveur.
    networks: [interne, isole, antivirus, web]

  portail:
    image: vinasign/web-portail:${VINASIGN_VERSION:?}
    container_name: vinasign-portail
    restart: unless-stopped
    <<: *journal
    environment:
      VINASIGN_API_URL: http://vinasign-serveur:8300
      VINASIGN_ANCETRES_AUTORISES: "'none'"
      VINASIGN_FOURNISSEUR_IDENTITE: https://id.vinasign.vinaitsolution.com
    volumes: ["./config/portail.json:/usr/share/nginx/html/config.json:ro"]
    read_only: true
    tmpfs: ["/tmp", "/etc/nginx/conf.d", "/var/cache/nginx"]
    mem_limit: 64m
    networks: [interne, web]

  signataire:
    image: vinasign/web-signataire:${VINASIGN_VERSION:?}
    container_name: vinasign-signataire
    restart: unless-stopped
    <<: *journal
    environment:
      VINASIGN_API_URL: http://vinasign-serveur:8300
      VINASIGN_ANCETRES_AUTORISES: "'none'"
    volumes: ["./config/signataire.json:/usr/share/nginx/html/config.json:ro"]
    read_only: true
    tmpfs: ["/tmp", "/etc/nginx/conf.d", "/var/cache/nginx"]
    mem_limit: 64m
    networks: [interne, web]

volumes:
  base:
  stockage:
  icp-etat:

networks:
  interne:
  isole: { internal: true }
  web: { external: true }
  # ClamAV déjà en service sur ce VPS (freelance-clamav) : 1,2 Go de signatures en mémoire ne se dupliquent pas sur un
  # serveur partagé. Remplacer par un service « antivirus » propre dès que la mémoire le permet.
  antivirus: { external: true, name: freelance-invoicing_freelance-net }
