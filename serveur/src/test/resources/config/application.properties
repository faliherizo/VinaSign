# Réglages propres aux tests (adresses fictives, clé de jeton générée à chaque exécution).
vinasign.jetons.emetteur=https://auth.vinasign.test
vinasign.jetons.audience=https://api.vinasign.test
vinasign.jetons.cle-ephemere-autorisee=true
vinasign.portail.emetteur=https://idp.vinasign.test
vinasign.portail.audience=api://vinasign-essai
vinasign.portail.jwk-set-uri=https://idp.vinasign.test/jwks
vinasign.debit.anonyme-par-minute=1000000
# Stockage et antivirus : adresses inertes par défaut (aucune connexion à la création) ; les tests qui déposent des
# documents importent StockageDeTest, qui branche Azurite et ClamAV réels.
vinasign.enveloppes.stockage.connexion=DefaultEndpointsProtocol=http;AccountName=inerte;AccountKey=aW5lcnRl;BlobEndpoint=http://127.0.0.1:1/inerte
vinasign.enveloppes.url-publique=https://api.vinasign.test
vinasign.base.pool.maximum-pool-size=4
# Expédition des courriels pilotée par les tests (aucune tâche planifiée pendant les tests) ; relais inerte par défaut.
vinasign.notification.intervalle=PT24H
spring.mail.host=127.0.0.1
spring.mail.port=1
vinasign.session.intervalle-relances=PT24H
# Expiration pilotée par les tests (la tâche planifiée expirerait les enveloppes avant eux).
vinasign.enveloppes.expiration.intervalle=PT24H
vinasign.enveloppes.finalisation.intervalle=PT24H
vinasign.preuve.ancrage.intervalle=PT24H
vinasign.archivage.intervalle=PT24H
vinasign.webhooks.intervalle=PT24H
