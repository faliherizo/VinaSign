databaseChangeLog:
  - changeSet:
      id: 001-1-referentiel
      author: vinasign
      comment: "Référentiels : toute liste métier vit ici (CLAUDE.md, règle « tout est dynamique »)."
      changes:
        - createTable:
            tableName: referentiel_type
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: code, type: VARCHAR(60), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_referentiel_type_code } }
              - column: { name: libelles, type: JSONB, constraints: { nullable: false } }
              - column: { name: cree_le, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: referentiel_valeur
            columns:
              - column: { name: id, type: UUID, defaultValueComputed: gen_random_uuid(), constraints: { primaryKey: true, nullable: false } }
              - column: { name: type_id, type: UUID, constraints: { nullable: false, foreignKeyName: fk_referentiel_valeur_type, references: referentiel_type(id), deleteCascade: true } }
              - column: { name: tenant_id, type: UUID }
              - column: { name: code, type: VARCHAR(60), constraints: { nullable: false } }
              - column: { name: libelles, type: JSONB, constraints: { nullable: false } }
              - column: { name: ordre, type: INTEGER, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: attributs, type: JSONB, defaultValue: "{}", constraints: { nullable: false } }
              - column: { name: actif, type: BOOLEAN, defaultValueBoolean: true, constraints: { nullable: false } }
        - sql:
            comment: "Une valeur commune (tenant_id nul) ou propre à une organisation est unique par code."
            sql: >
              CREATE UNIQUE INDEX uk_referentiel_valeur_code ON referentiel_valeur
              (type_id, COALESCE(tenant_id, '00000000-0000-0000-0000-000000000000'::uuid), code)
