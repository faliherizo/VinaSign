# Les secrets restent dans Key Vault ; le pilote CSI les présente au pod et les synchronise dans un Secret Kubernetes
# lu en variables d'environnement. Aucun secret dans ce chart ni dans les images.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vinasign-coffre
  namespace: {{ .Release.Namespace }}
spec:
  provider: azure
  parameters:
    clientID: {{ .Values.coffre.identiteClientId | quote }}
    keyvaultName: {{ required "coffre.nom est requis" .Values.coffre.nom | quote }}
    tenantId: {{ required "coffre.locataire est requis" .Values.coffre.locataire | quote }}
    objects: |
      array:
      {{- range $variable, $secret := .Values.coffre.secrets }}
        - |
          objectName: {{ $secret }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: vinasign-serveur
      type: Opaque
      data:
      {{- range $variable, $secret := .Values.coffre.secrets }}
        - objectName: {{ $secret }}
          key: {{ $variable }}
      {{- end }}
