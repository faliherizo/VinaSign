# Refus réseau par défaut dans l'espace de noms ; seuls les flux nécessaires sont ouverts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: refus-par-defaut
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entree-vers-interfaces-et-api
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [vinasign-serveur, vinasign-portail, vinasign-signataire] }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: http }
